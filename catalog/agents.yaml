#USDC 토큰 계약 주소
asset: 0x036CbD53842c5426634e7929541eC2318f3dCF7e

#에이전트를 등록하는 개발자의 식별자와 이름
developer:
  id: 00000000-0000-0000-0000-00000000d001
  name: AgentStore Demo


functionContracts:

  - code: investment-analysis
    name: 투자 분석
    description: 여러 분석 결과를 종합하는 투자 분석 기능입니다.
    responseFormat: MARKDOWN
    inputSchema:
      type: object
      additionalProperties: true
    outputSchema:
      type: string

  - code: financial-analysis
    name: 재무 분석
    description: 재무 지표와 위험을 구조화해 제공하는 기능입니다.
    responseFormat: JSON
    inputSchema:
      type: object
      additionalProperties: true
    outputSchema:
      type: object
      additionalProperties: false
      required:
        - keyMetrics
        - risks
        - sources
        - summary
      properties:
        summary:
          type: string
        keyMetrics:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - url
            properties:
              title:
                type: string
              url:
                type: string
                format: uri

  - code: market-news-analysis
    name: 시장 뉴스 분석
    description: 시장 뉴스 흐름과 핵심 근거를 구조화해 제공하는 기능입니다.
    responseFormat: JSON
    inputSchema:
      type: object
      additionalProperties: true
    outputSchema:
      type: object
      additionalProperties: false
      required:
        - highlights
        - sentiment
        - sources
        - summary
      properties:
        summary:
          type: string
        sentiment:
          type: string
