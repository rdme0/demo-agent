            - positive
            - neutral
            - negative
            - mixed
        highlights:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - url
            properties:
              title:
                type: string
              url:
                type: string
